services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atena}
      POSTGRES_DB: ${POSTGRES_DB:-atena_study}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atena} -d ${POSTGRES_DB:-atena_study}"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://atena:atena@db:5432/atena_study}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3100,http://localhost:3000,http://web:3000}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
    ports:
      - "8100:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8100}
    ports:
      - "3100:3000"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    # `npm install` garante que o volume de node_modules acompanhe o package.json
    # (dependências novas adicionadas depois do build ficariam faltando).
    command: sh -c "npm install --no-audit --no-fund && npm run dev"

volumes:
  postgres_data:
  qdrant_data:
